name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check public repository policy
        run: |
          ./scripts/check-public-repo.sh
          ./scripts/test-check-public-repo.sh
          ./scripts/test-prepare-replay-apk.sh
          python3 ./scripts/test-replay-emulator-gps.py

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Test boot package generator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick zip unzip
          bash -n boot/scripts/*.sh
          ./boot/scripts/test-generate.sh

      - name: Test, lint and build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug
          else
            ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease
          fi

  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Validate tag and Android version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import os
          from pathlib import Path

          def versions(source):
              name = re.search(r'^\s*versionName\s*=\s*"([^"]+)"', source, re.MULTILINE)
              code = re.search(r'^\s*versionCode\s*=\s*(\d+)', source, re.MULTILINE)
              if not name or not code:
                  raise SystemExit("Could not read versionName/versionCode from app/build.gradle.kts")
              return name.group(1), int(code.group(1))

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v1.3.1")

          current_name, current_code = versions(Path("app/build.gradle.kts").read_text())
          if tag.removeprefix("v") != current_name:
              raise SystemExit(f"Tag {tag} must match app versionName {current_name}")

          previous_tags = subprocess.check_output(
              ["git", "tag", "--list", "v*", "--sort=-version:refname"], text=True
          ).splitlines()
          previous = next((value for value in previous_tags if value != tag), None)
          if previous:
              previous_source = subprocess.check_output(
                  ["git", "show", f"{previous}:app/build.gradle.kts"], text=True
              )
              _, previous_code = versions(previous_source)
              if current_code <= previous_code:
                  raise SystemExit(
                      f"versionCode {current_code} must exceed {previous} versionCode {previous_code}"
                  )
          PY

      - name: Restore release signing key
        env:
          A5_RELEASE_KEYSTORE_BASE64: ${{ secrets.A5_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$A5_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$A5_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a5-cockpit-release.jks"
          test -s "$RUNNER_TEMP/a5-cockpit-release.jks"

      - name: Build signed release APK
        env:
          A5_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/a5-cockpit-release.jks
          A5_RELEASE_STORE_PASSWORD: ${{ secrets.A5_RELEASE_STORE_PASSWORD }}
          A5_RELEASE_KEY_ALIAS: ${{ secrets.A5_RELEASE_KEY_ALIAS }}
          A5_RELEASE_KEY_PASSWORD: ${{ secrets.A5_RELEASE_KEY_PASSWORD }}
          A5_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/A5Cockpit.apk
          (cd dist && sha256sum A5Cockpit.apk > A5Cockpit.apk.sha256)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/A5Cockpit.apk dist/A5Cockpit.apk.sha256
          --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/a5-cockpit-release.jks"
