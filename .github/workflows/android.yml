name: Android CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check public repository policy
        run: |
          ./scripts/check-public-repo.sh
          ./scripts/test-check-public-repo.sh
          ./scripts/test-prepare-replay-apk.sh
          python3 ./scripts/test-replay-emulator-gps.py
          python3 ./scripts/test-release-version.py

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The Ubuntu mirror is sometimes very slow (95 MB took 15 minutes), so the
      # downloaded packages are cached and only the package lists are fetched.
      - name: Restore boot generator packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-boot-${{ runner.os }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: apt-boot-${{ runner.os }}-

      - name: Test boot package generator
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            ffmpeg imagemagick zip unzip
          sudo chown -R "$USER" ~/apt-archives
          bash -n boot/scripts/*.sh
          ./boot/scripts/test-generate.sh

      - name: Test, lint and build
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease
