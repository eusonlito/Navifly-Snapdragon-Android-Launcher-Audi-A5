name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check public repository policy
        run: |
          ./scripts/check-public-repo.sh
          ./scripts/test-check-public-repo.sh
          ./scripts/test-prepare-replay-apk.sh

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Test boot package generator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick zip unzip
          bash -n boot/scripts/*.sh
          ./boot/scripts/test-generate.sh

      - name: Test, lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease
